<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7L SEVEN LEAGUE BASEL - Official Match Center</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slDark: '#0a0f1d',
                        slCard: '#131c31',
                        slGold: '#d4af37',
                        slAccent: '#00f0ff',
                    },
                    fontFamily: {
                        bebas: ['Bebas Neue', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0f1d; color: #f8fafc; font-family: 'Rajdhani', sans-serif; }
        .glass-panel { background: rgba(19, 28, 49, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .glow-gold { box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .glow-cyan { box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .glass-panel { background: white !important; border: 1px solid #ccc !important; box-shadow: none !important; color: black !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ENCABEZADO OFICIAL CON LOGOTIPO SEVEN LEAGUE -->
    <header class="glass-panel border-b border-slGold/30 sticky top-0 z-50 px-4 py-3 flex justify-between items-center no-print">
        <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-slGold via-yellow-500 to-amber-700 flex items-center justify-center glow-gold text-slDark font-orbitron font-900 text-xl border border-slGold">
                7L
            </div>
            <div>
                <h1 class="font-bebas tracking-wider text-2xl text-slGold leading-none">SEVEN LEAGUE</h1>
                <p class="text-xs text-slAccent font-orbitron uppercase tracking-widest">Basel Competition Hub</p>
            </div>
        </div>
        <nav class="flex space-x-2">
            <button onclick="switchTab('match')" id="btn-tab-match" class="px-3 py-1.5 rounded-lg bg-slGold/20 text-slGold font-bold text-sm border border-slGold/40 transition"><i class="fa-solid fa-stopwatch mr-1"></i> Árbitro</button>
            <button onclick="switchTab('teams')" id="btn-tab-teams" class="px-3 py-1.5 rounded-lg bg-slCard text-slate-300 font-bold text-sm border border-slate-700 transition hover:text-slGold"><i class="fa-solid fa-users mr-1"></i> Equipos</button>
            <button onclick="switchTab('attendance')" id="btn-tab-attendance" class="px-3 py-1.5 rounded-lg bg-slCard text-slate-300 font-bold text-sm border border-slate-700 transition hover:text-slGold"><i class="fa-solid fa-file-signature mr-1"></i> Acta A4</button>
        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">

        <!-- VISTA 1: INTERFAZ INTERACTIVA DEL ÁRBITRO -->
        <section id="tab-match" class="space-y-6">
            <div class="glass-panel rounded-2xl p-6 glow-cyan relative">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center text-center">
                    
                    <!-- Equipo Local -->
                    <div class="space-y-2">
                        <select id="select-home-team" onchange="changeMatchTeams()" class="bg-slDark border border-slGold/40 text-slGold font-bebas text-2xl rounded-lg p-2 w-full text-center outline-none">
                        </select>
                        <div class="text-6xl font-orbitron font-900 text-white" id="score-home">0</div>
                        <div class="flex justify-center space-x-2">
                            <button onclick="updateScore('home', 1)" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-1.5 rounded-lg font-bold text-sm text-white">+ Gol</button>
                            <button onclick="updateScore('home', -1)" class="bg-rose-900/60 hover:bg-rose-800 px-3 py-1.5 rounded-lg text-xs text-rose-300">-</button>
                        </div>
                    </div>

                    <!-- CRONÓMETRO ÁRBITRO (SUMA MINUTOS CORRECTAMENTE) -->
                    <div class="flex flex-col items-center justify-center bg-slDark/80 p-5 rounded-2xl border border-slGold/30 glow-gold">
                        <span id="match-period" class="text-xs font-orbitron text-slAccent mb-1 font-bold">1ER TIEMPO (25 MIN)</span>
                        <div id="match-timer" class="font-orbitron text-5xl font-900 text-slGold tracking-widest my-2">00:00</div>
                        <div class="flex space-x-2 mt-2">
                            <button onclick="toggleTimer()" id="btn-timer" class="bg-slGold text-slDark px-5 py-2 rounded-lg font-bold text-xs uppercase hover:bg-yellow-400 transition">Iniciar</button>
                            <button onclick="resetTimer()" class="bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-xs hover:bg-slate-600 transition">Reiniciar</button>
                        </div>
                    </div>

                    <!-- Equipo Visitante -->
                    <div class="space-y-2">
                        <select id="select-away-team" onchange="changeMatchTeams()" class="bg-slDark border border-slGold/40 text-slGold font-bebas text-2xl rounded-lg p-2 w-full text-center outline-none">
                        </select>
                        <div class="text-6xl font-orbitron font-900 text-white" id="score-away">0</div>
                        <div class="flex justify-center space-x-2">
                            <button onclick="updateScore('away', 1)" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-1.5 rounded-lg font-bold text-sm text-white">+ Gol</button>
                            <button onclick="updateScore('away', -1)" class="bg-rose-900/60 hover:bg-rose-800 px-3 py-1.5 rounded-lg text-xs text-rose-300">-</button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- GENERADOR MVP CON FOTO DE JUGADOR -->
            <div class="glass-panel rounded-xl p-5 space-y-4 border border-slGold/30">
                <h3 class="font-bebas text-2xl text-slGold flex items-center"><i class="fa-solid fa-trophy mr-2 text-amber-400"></i> Selección de MVP del Partido</h3>
                <div class="flex flex-col sm:flex-row gap-3">
                    <select id="mvp-player-select" class="flex-1 bg-slDark border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-slGold outline-none">
                        <option value="">Seleccionar Jugador Destacado...</option>
                    </select>
                    <button onclick="generateMVP()" class="bg-slGold text-slDark font-bold px-6 py-3 rounded-lg text-sm hover:bg-yellow-400 transition">Generar Tarjeta MVP</button>
                </div>
            </div>
        </section>

        <!-- VISTA 2: EQUIPOS Y FICHAS DE JUGADORES CON FOTOS -->
        <section id="tab-teams" class="space-y-6 hidden">
            <div class="flex justify-between items-center">
                <h2 class="font-bebas text-3xl text-slGold">Equipos Seven League Basel</h2>
                <span class="text-xs text-slAccent font-orbitron">Click en un equipo para ver la plantilla</span>
            </div>
            <div id="teams-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <!-- Inyectado por JS -->
            </div>
        </section>

        <!-- VISTA 3: ACTA DE ASISTENCIA EN 1 SOLA PÁGINA (ALINEADA A LA IZQUIERDA) -->
        <section id="tab-attendance" class="space-y-6 hidden">
            <div class="glass-panel rounded-xl p-6 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-700 pb-4 no-print">
                    <div>
                        <h2 class="font-bebas text-2xl text-slGold">Acta Oficial de Asistencia</h2>
                        <p class="text-xs text-slate-400">Formato optimizado para 1 sola página PDF / Impresión</p>
                    </div>
                    <button onclick="window.print()" class="bg-slGold text-slDark font-bold px-5 py-2 rounded-lg text-sm hover:bg-yellow-400 transition"><i class="fa-solid fa-print mr-2"></i> Imprimir PDF</button>
                </div>

                <div id="attendance-content" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Se genera por JS de forma alineada -->
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL FICHAS Y TARJETA MVP -->
    <div id="modal-container" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel rounded-2xl max-w-md w-full p-6 relative border border-slGold/50 text-center space-y-4">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- CÓDIGO DE CONTROL UNIFICADO -->
    <script>
        // Database de los 10 equipos de Seven League con fotos en fichas de jugadores
        const defaultTeams = [
            { id: 1, name: "FC Max Basel", players: [ {name: "Marco Rossi", num: 10, photo: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=200"}, {name: "Luca Moretti", num: 7, photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200"} ] },
            { id: 2, name: "Rhine Lions FC", players: [ {name: "Stefan Meier", num: 1, photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200"}, {name: "Julian Keller", num: 9, photo: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=200"} ] },
            { id: 3, name: "Joga Bonito FC", players: [ {name: "Neymar Silva", num: 11, photo: ""}, {name: "Carlos Dos Santos", num: 8, photo: ""} ] },
            { id: 4, name: "Rhine Madrid", players: [ {name: "Alejandro Ramos", num: 4, photo: ""}, {name: "Mateo Kovac", num: 10, photo: ""} ] },
            { id: 5, name: "FC Baselona", players: [ {name: "Andres Iniesta", num: 8, photo: ""}, {name: "Lionel Piqué", num: 3, photo: ""} ] },
            { id: 6, name: "FC Sportfreunde", players: [ {name: "Hans Gruber", num: 5, photo: ""}, {name: "Lukas Weber", num: 14, photo: ""} ] },
            { id: 7, name: "Inter Ya Ma FC", players: [ {name: "Yao Ming", num: 12, photo: ""}, {name: "Samir Ben", num: 6, photo: ""} ] },
            { id: 8, name: "DPS Basel FC", players: [ {name: "David Silva", num: 21, photo: ""}, {name: "Paul Pogba", num: 6, photo: ""} ] },
            { id: 9, name: "BG FC", players: [ {name: "Boris G.", num: 10, photo: ""}, {name: "Goran T.", num: 7, photo: ""} ] },
            { id: 10, name: "Inter Basel", players: [ {name: "Fabian Frei", num: 20, photo: ""}, {name: "Taulant Xhaka", num: 34, photo: ""} ] }
        ];

        // Sincronización inteligente (Mantiene jugadores agregados manualmente)
        let teams = JSON.parse(localStorage.getItem('sl_teams')) || defaultTeams;
        localStorage.setItem('sl_teams', JSON.stringify(teams));

        let secondsElapsed = 0;
        let timerInterval = null;
        let isTimerRunning = false;

        // Cronómetro corregido (Suma ascendente)
        function toggleTimer() {
            const btn = document.getElementById('btn-timer');
            if (!isTimerRunning) {
                isTimerRunning = true;
                btn.textContent = "PAUSAR";
                btn.className = "bg-rose-600 text-white px-5 py-2 rounded-lg font-bold text-xs uppercase hover:bg-rose-500 transition";
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);
            } else {
                isTimerRunning = false;
                btn.textContent = "CONTINUAR";
                btn.className = "bg-slGold text-slDark px-5 py-2 rounded-lg font-bold text-xs uppercase hover:bg-yellow-400 transition";
                clearInterval(timerInterval);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            secondsElapsed = 0;
            updateTimerDisplay();
            const btn = document.getElementById('btn-timer');
            btn.textContent = "INICIAR";
            btn.className = "bg-slGold text-slDark px-5 py-2 rounded-lg font-bold text-xs uppercase hover:bg-yellow-400 transition";
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('match-timer').textContent = `${mins}:${secs}`;
            document.getElementById('match-period').textContent = secondsElapsed >= 1500 ? "2DO TIEMPO (25 MIN)" : "1ER TIEMPO (25 MIN)";
        }

        function switchTab(tab) {
            ['match', 'teams', 'attendance'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-tab-${t}`).className = "px-3 py-1.5 rounded-lg bg-slCard text-slate-300 font-bold text-sm border border-slate-700 transition hover:text-slGold";
            });

            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-tab-${tab}`).className = "px-3 py-1.5 rounded-lg bg-slGold/20 text-slGold font-bold text-sm border border-slGold/40 transition";

            if (tab === 'teams') renderTeamsGrid();
            if (tab === 'attendance') renderAttendanceSheet();
        }

        function renderTeamsGrid() {
            const grid = document.getElementById('teams-grid');
            grid.innerHTML = teams.map(team => `
                <div onclick="showTeamModal(${team.id})" class="glass-panel p-4 rounded-xl flex flex-col items-center justify-between cursor-pointer hover:border-slGold transition border border-slate-800">
                    <div class="w-12 h-12 rounded-full bg-slGold/20 border border-slGold flex items-center justify-center text-slGold font-bebas text-xl">${team.name.substring(0,2).toUpperCase()}</div>
                    <h3 class="font-bebas text-lg text-white text-center mt-2">${team.name}</h3>
                    <span class="text-xs text-slAccent font-rajdhani font-bold">${team.players.length} Jugadores</span>
                </div>
            `).join('');
        }

        function showTeamModal(teamId) {
            const team = teams.find(t => t.id === teamId);
            const modalContent = document.getElementById('modal-content');
            
            const playersHtml = team.players.map(p => `
                <div class="flex items-center justify-between bg-slDark/80 p-3 rounded-lg border border-slate-800 text-left">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-slate-800 overflow-hidden border border-slGold/40 flex items-center justify-center">
                            ${p.photo ? `<img src="${p.photo}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-slate-400 text-sm"></i>`}
                        </div>
                        <div>
                            <p class="font-bold text-sm text-white leading-none">${p.name}</p>
                            <span class="text-xs text-slAccent font-orbitron">Dorsal #${p.num || '-'}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            modalContent.innerHTML = `
                <h3 class="font-bebas text-2xl text-slGold">${team.name}</h3>
                <p class="text-xs text-slate-400">Plantilla Oficial y Fichas de Jugadores</p>
                <div class="max-h-64 overflow-y-auto space-y-2 text-left">${playersHtml}</div>
            `;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function populateSelects() {
            const homeSel = document.getElementById('select-home-team');
            const awaySel = document.getElementById('select-away-team');
            const mvpSel = document.getElementById('mvp-player-select');

            const options = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
            homeSel.innerHTML = options;
            awaySel.innerHTML = options;
            awaySel.selectedIndex = 1;

            let mvpOptions = '<option value="">Seleccionar Jugador Destacado...</option>';
            teams.forEach(t => {
                t.players.forEach(p => {
                    mvpOptions += `<option value='${JSON.stringify({name: p.name, team: t.name, photo: p.photo})}'>${p.name} (${t.name})</option>`;
                });
            });
            mvpSel.innerHTML = mvpOptions;
        }

        function generateMVP() {
            const val = document.getElementById('mvp-player-select').value;
            if(!val) return alert("Selecciona un jugador.");
            const p = JSON.parse(val);

            document.getElementById('modal-content').innerHTML = `
                <div class="bg-gradient-to-br from-amber-600 via-slDark to-slCard p-6 rounded-xl border-2 border-slGold text-center space-y-3 glow-gold">
                    <span class="bg-slGold text-slDark px-3 py-1 rounded-full text-xs font-bold font-orbitron">MVP SEVEN LEAGUE</span>
                    <div class="w-24 h-24 rounded-full mx-auto border-2 border-slGold overflow-hidden bg-slate-800 flex items-center justify-center">
                        ${p.photo ? `<img src="${p.photo}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-3xl text-slGold"></i>`}
                    </div>
                    <h3 class="font-bebas text-3xl text-white">${p.name}</h3>
                    <p class="text-slAccent font-orbitron text-xs">${p.team}</p>
                </div>
                <button onclick="window.print()" class="w-full bg-slGold text-slDark font-bold py-2 rounded-lg text-sm no-print">Imprimir Tarjeta MVP</button>
            `;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function renderAttendanceSheet() {
            const homeId = parseInt(document.getElementById('select-home-team').value);
            const awayId = parseInt(document.getElementById('select-away-team').value);
            const home = teams.find(t => t.id === homeId) || teams[0];
            const away = teams.find(t => t.id === awayId) || teams[1];

            const renderRows = (players) => players.map(p => `
                <div class="flex justify-between items-center bg-slDark/80 p-2.5 rounded border border-slate-800 text-left">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-slAccent font-bold">#${p.num || '-'}</span>
                        <span class="text-white text-sm font-semibold">${p.name}</span>
                    </div>
                    <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/30 font-bold">ASISTENTE</span>
                </div>
            `).join('');

            document.getElementById('attendance-content').innerHTML = `
                <div>
                    <h3 class="font-bebas text-xl text-slAccent mb-2 border-b border-slate-700 pb-1 text-left">${home.name}</h3>
                    <div class="space-y-1.5">${renderRows(home.players)}</div>
                </div>
                <div>
                    <h3 class="font-bebas text-xl text-slAccent mb-2 border-b border-slate-700 pb-1 text-left">${away.name}</h3>
                    <div class="space-y-1.5">${renderRows(away.players)}</div>
                </div>
            `;
        }

        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }
        function updateScore(team, val) {
            const el = document.getElementById(`score-${team}`);
            let cur = parseInt(el.textContent) + val;
            el.textContent = cur < 0 ? 0 : cur;
        }

        // Inicialización
        populateSelects();
    </script>
</body>
</html>
