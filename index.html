<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>7L SEVEN LEAGUE - Match Center</title>
  <meta name="theme-color" content="#d32f2f">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: #141419;
      --card-border: #262630;
      --accent-red: #e53935;
      --accent-gold: #ffb300;
      --text-main: #f5f5f7;
      --text-muted: #8e8e93;
      --green-gol: #00e676;
      --yellow-card: #ffea00;
      --red-card: #ff1744;
      --font-display: 'Bebas Neue', sans-serif;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 12px; max-width: 650px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }

    header { text-align: center; padding: 12px 0 16px 0; border-bottom: 2px solid var(--accent-red); margin-bottom: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    /* Shield Placeholder en CSS/SVG si la foto falta */
    .app-logo-box { font-family: var(--font-display); font-size: 2rem; color: #fff; letter-spacing: 2px; }
    .app-logo-box span { color: var(--accent-red); }

    /* Tabs */
    .tabs-nav { display: flex; background: var(--card-bg); border-radius: 10px; padding: 4px; border: 1px solid var(--card-border); margin-bottom: 16px; gap: 4px; }
    .tab-button { flex: 1; padding: 10px 0; background: none; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 700; cursor: pointer; text-transform: uppercase; border-radius: 6px; }
    .tab-button.active { color: #fff; background-color: var(--accent-red); box-shadow: 0 2px 10px rgba(229,57,53,0.4); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Marcador Principal */
    .scoreboard-box { background: linear-gradient(180deg, #181820 0%, #0d0d12 100%); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; position: relative; }
    .teams-vs { display: flex; justify-content: space-between; align-items: center; }
    .team-item { text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; }
    
    .team-logo-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #1c1c24;
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .team-logo-img { width: 100%; height: 100%; object-fit: contain; }
    .team-logo-fallback { font-family: var(--font-display); font-size: 1.2rem; color: var(--accent-gold); }

    .team-title { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.5px; line-height: 1.1; }
    .score-num { font-family: var(--font-display); font-size: 3.5rem; line-height: 1; color: #fff; }
    .vs-badge { font-family: var(--font-display); font-size: 1.3rem; color: var(--text-muted); padding: 0 8px; }

    .ref-badge { background: #1c1c24; border: 1px solid var(--card-border); color: var(--accent-gold); border-radius: 8px; padding: 8px 12px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; text-align: center; }

    /* Cronómetro */
    .timer-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 16px; }
    .timer-period { font-size: 0.75rem; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; }
    .timer-clock { font-family: var(--font-display); font-size: 3rem; letter-spacing: 2px; color: #fff; line-height: 1; margin: 4px 0; }
    .timer-btn-row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    .btn-t { background: #22222d; color: #fff; border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; text-transform: uppercase; }

    /* Card/Formularios */
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card-head { font-family: var(--font-display); font-size: 1.2rem; color: var(--accent-red); border-bottom: 1px solid var(--card-border); padding-bottom: 8px; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--card-border); background: #1c1c24; color: #fff; font-size: 0.9rem; font-weight: 600; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    button.btn-act { width: 100%; padding: 14px; background: var(--accent-red); color: white; border: none; border-radius: 8px; font-weight: 800; font-size: 0.9rem; cursor: pointer; text-transform: uppercase; }
    button.btn-sec { width: 100%; padding: 12px; background: #22222d; color: white; border: 1px solid var(--card-border); border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-top: 8px; }
    button.btn-danger { width: 100%; padding: 10px; background: #3b1113; color: #ff5252; border: 1px solid #5c1d1f; border-radius: 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer; margin-top: 12px; }

    /* Timeline */
    .timeline-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1f1f28; }
    .timeline-badge { font-family: var(--font-display); font-size: 0.9rem; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    .bg-gol { background: var(--green-gol); color: #000; }
    .bg-a { background: var(--yellow-card); color: #000; }
    .bg-r { background: var(--red-card); color: #fff; }

    .check-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1f1f28; }
    .check-label { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; flex: 1; }
  </style>
</head>
<body>

  <header>
    <div class="app-logo-box">7L <span>SEVEN LEAGUE</span></div>
  </header>

  <div class="ref-badge">
    👨‍⚖️ Árbitro Oficial: <span id="refereeNameDisplay">SAMUEL MCKENZIE</span>
  </div>

  <nav class="tabs-nav">
    <button class="tab-button active" onclick="switchTab('tab-partido', event)">1. Partido</button>
    <button class="tab-button" onclick="switchTab('tab-asistencia', event)">2. Asistencia</button>
    <button class="tab-button" onclick="switchTab('tab-historial', event)">3. Historial</button>
  </nav>

  <!-- TAB 1: PARTIDO -->
  <div id="tab-partido" class="tab-content active">
    
    <div class="scoreboard-box">
      <div class="teams-vs">
        <div class="team-item">
          <div class="team-logo-wrapper" id="logoWrap1"></div>
          <div class="team-title" id="nameTeam1">LOCAL</div>
          <div class="score-num" id="score1">0</div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="team-item">
          <div class="team-logo-wrapper" id="logoWrap2"></div>
          <div class="team-title" id="nameTeam2">VISITANTE</div>
          <div class="score-num" id="score2">0</div>
        </div>
      </div>
    </div>

    <!-- Cronómetro -->
    <div class="timer-card">
      <div class="timer-period" id="periodDisplay">1er Tiempo (25 Min)</div>
      <div class="timer-clock" id="timerDisplay">00:00</div>
      <div class="timer-btn-row">
        <button class="btn-t" id="btnStart" onclick="toggleTimer()">▶ Iniciar</button>
        <button class="btn-t" onclick="setPeriod(1)">1T</button>
        <button class="btn-t" onclick="setPeriod(2)">2T</button>
      </div>
    </div>

    <!-- Configuración -->
    <div class="card">
      <div class="card-head">Configurar Partido</div>
      <div class="form-row">
        <div class="form-group">
          <label>Equipo Local</label>
          <select id="matchTeam1Select" onchange="changeMatchTeams()"></select>
        </div>
        <div class="form-group">
          <label>Equipo Visitante</label>
          <select id="matchTeam2Select" onchange="changeMatchTeams()"></select>
        </div>
      </div>
      <div class="form-group">
        <label>Nombre del Árbitro</label>
        <input type="text" id="refNameInput" value="SAMUEL MCKENZIE" onchange="updateRefName()">
      </div>
    </div>

    <!-- Registro de Incidencias -->
    <div class="card">
      <div class="card-head">Registrar Incidencia</div>
      <div class="form-group">
        <label>Equipo de la Incidencia</label>
        <select id="teamSelect" onchange="updatePlayerDropdowns()"></select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Minuto</label>
          <input type="number" id="minuteInput" value="1" min="1" max="60">
        </div>
        <div class="form-group">
          <label>Evento</label>
          <select id="typeSelect" onchange="toggleAssistField()">
            <option value="GOL">⚽ GOL</option>
            <option value="A">🟨 Amarilla (A)</option>
            <option value="R">🟥 Roja (R)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Jugador (Filtrado por equipo)</label>
        <select id="playerSelect"></select>
      </div>
      <div class="form-group" id="assistGroup">
        <label>Asistencia (Opcional - Mismo equipo)</label>
        <select id="assistSelect"></select>
      </div>
      <button class="btn-act" onclick="addEvent()">Guardar Evento</button>
    </div>

    <div class="card">
      <div class="card-head">Match Timeline</div>
      <div id="eventsListContainer">Sin incidencias.</div>
    </div>

    <div class="card">
      <div class="card-head">Jugador del Partido (MVP)</div>
      <select id="mvpSelect" onchange="saveMVP()"><option value="">-- Seleccionar MVP --</option></select>
    </div>

    <button class="btn-act" style="background:#2e7d32;" onclick="exportSummary()">📲 Copiar Acta para WhatsApp</button>
    <button class="btn-sec" onclick="archiveMatch()">💾 Archivar Partido en Historial</button>
    <button class="btn-danger" onclick="resetAppData()">⚠️ Limpiar memoria de la App (Solucionar Errores)</button>
  </div>

  <!-- TAB 2: ASISTENCIA -->
  <div id="tab-asistencia" class="tab-content">
    <div class="card">
      <div class="card-head"><span id="attTitle1">LOCAL</span></div>
      <div id="list-att-1"></div>
    </div>
    <div class="card">
      <div class="card-head"><span id="attTitle2">VISITANTE</span></div>
      <div id="list-att-2"></div>
    </div>
  </div>

  <!-- TAB 3: HISTORIAL -->
  <div id="tab-historial" class="tab-content">
    <div class="card">
      <div class="card-head">Partidos Archivados</div>
      <div id="savedMatchesContainer">Sin partidos archivados.</div>
    </div>
  </div>

  <script>
    const defaultTeams = {
      "eq_1": { id: "eq_1", name: "Inter Ya Ma FC", logo: "logo_inter_yama.png", short: "IYM", players: ["Lorenzo di Gregorio", "Ricard Castells", "Ethan Robinson", "Arron Robinson", "Gianfi", "James Conlon", "John Vial Lian Mung", "Nacho Nuño", "Pol Castells", "Víctor", "Yousri Sghaier", "Zak Robinson"] },
      "eq_2": { id: "eq_2", name: "Rhine Lions FC", logo: "logo_rhine_lions.png", short: "RLI", players: ["Alejandro Signoret", "Cesar Galera", "Fernando Ortiz", "Nasser Mawad", "Nick Erazo", "Ori Roethler", "Panji Buana", "Patricia Wieland", "Rene Hersperger", "Timon Hari", "Xavier Plo"] },
      "eq_3": { id: "eq_3", name: "FC Sportfreunde", logo: "logo_sportfreunde.png", short: "SPO", players: ["Luca Kropf", "Yanick", "Gonçalo Rodrigues", "Bilal Ben Romdhane", "Burim Lulaj", "David Ortiz", "Elias Chigha", "Gabriel dos Santos", "Guilherme Gonçalves", "Jairo Diaz", "Jeremiah Wilson-Parham", "Jose Rocha", "Justin Kenny", "Marcel Branagh", "Pablo Andres", "Paul Jurcut", "Reza", "Schinzo", "Slobodan Pavlovic"] },
      "eq_4": { id: "eq_4", name: "FC Max Basel", logo: "logo_max_basel.png", short: "MAX", players: ["Denis Cornelio", "Jan Sieber", "Sergiu Petrica", "Pablo Verdes", "Alex Costa", "Greg Imber", "Yassin", "Carlos Caliani", "Antü Urrea", "Dima Cernica", "Federico Barriga", "Guillermo García", "Jairo Botello", "Pedro Prieto", "Víctor Molinari"] },
      "eq_5": { id: "eq_5", name: "FC Baselona", logo: "logo_baselona.png", short: "BAS", players: ["Alexis Gabriel Martinez", "Azzaro Cespedes", "Juan Lucas Gordillo", "Alvaro Herrero", "Aridane Moreno", "Francisco Yanez", "Gaspar Riveros", "Hector Moya", "Jean-Pierre Ortiz", "Joao Carlos Pinto", "Tamas Dalmay", "William Tejada"] },
      "eq_6": { id: "eq_6", name: "Joga Bonito FC", logo: "logo_joga_bonito.png", short: "JOG", players: ["Efraim Benoit Ferreira", "Matheus Nascimento", "Victor Gustavo Marques", "Lendrick Machado", "André Filipe da Silva", "Edson Alex Panta", "Eduardo Pereira da Silva", "Igor Mateus Silva", "Leomir Casagrande", "Leonardo da Silva", "Maxsuel Santos", "Maxwell Stanyo Alves", "Raphael Aflalo Lopes", "Sergio Marconi Fonseca", "Silvio Patrício"] },
      "eq_7": { id: "eq_7", name: "BG FC", logo: "logo_bg_fc.png", short: "BG", players: ["Emilio Miró", "Javier Calderón", "Juan Rodriguez", "Gabriele Iannucci", "Genni Mariniello", "Armando Babayan", "Christian Stevens", "Louis Vanoise", "Pablo Cabrales", "Romain de Guillebon", "Victor Costé de Bagneaux", "Virgile Soubiran", "Álvaro Morcillo"] },
      "eq_8": { id: "eq_8", name: "DPS Basel FC", logo: "logo_dps_basel.png", short: "DPS", players: ["Jaroslaw Strygner", "Simon Nobel", "Brian Wickham", "Oliver Dowling", "Pablo Lora", "Patrick Kellehan", "Diogo Ladeiras", "Filippo Busu", "Ibrahima Sow", "Jacopo Bernasconi", "Juan Francisco Moreno", "Mike Topjian", "Nils Chartier", "Simon Blanche", "Cagatay Cinar", "Jorge Garcia", "Jetmir Xhema", "Conor Maye", "Jaleel Ashik", "Noah Jose Carlos Bellakovics", "Panagiotis Panos"] },
      "eq_9": { id: "eq_9", name: "Rhine Madrid", logo: "logo_rhine_madrid.png", short: "RMA", players: ["Hamed Goudarzi", "Nicolas Wehrli", "Christian Schlote", "Joonatan Van Eecke", "Khamlek Chaton", "Steven Munyoo", "Franklyn Sciberras", "Jonathan Osaigbovo", "Junica Lucian", "Jürgen Schneider", "Logan Jungen", "Luca Sieber", "Marc Zuger", "Matthias Vogler", "Rharin", "Steiner"] },
      "eq_10": { id: "eq_10", name: "Inter Basel", logo: "logo_inter_basel.png", short: "INB", players: ["Anas Moutacharrif", "Ahmed Tawfik", "Athithiyan Senthilkumar", "Elleno Noviello", "Jamal Budair", "Karim Zahra", "Marvin Meier", "Marwan Ibrahim", "Micha Gelencser", "Oualid El Hafian", "Samuel Mc'Kenzie", "Victor Melado"] }
    };

    let currentTeam1Id = localStorage.getItem('sl_t1') || "eq_1";
    let currentTeam2Id = localStorage.getItem('sl_t2') || "eq_2";
    let refereeName = localStorage.getItem('sl_ref') || "SAMUEL MCKENZIE";

    let attendance = JSON.parse(localStorage.getItem('sl_att')) || {};
    let events = JSON.parse(localStorage.getItem('sl_ev')) || [];
    let selectedMVP = localStorage.getItem('sl_mvp') || '';
    let savedMatches = JSON.parse(localStorage.getItem('sl_hist')) || [];

    let timerRunning = false;
    let startTime = 0;
    let elapsedTimeBeforePause = 0;
    let timerInterval = null;

    function init() {
      document.getElementById('refNameInput').value = refereeName;
      document.getElementById('refereeNameDisplay').innerText = refereeName;
      renderTeamSelectors();
      setupMatchTeams();
      renderHistory();
    }

    function resetAppData() {
      if (confirm("¿Quieres borrar la memoria interna de la app? Esto solucionará problemas de sincronización.")) {
        localStorage.clear();
        location.reload();
      }
    }

    function updateRefName() {
      refereeName = document.getElementById('refNameInput').value || "SAMUEL MCKENZIE";
      document.getElementById('refereeNameDisplay').innerText = refereeName;
      localStorage.setItem('sl_ref', refereeName);
    }

    function switchTab(tabId, ev) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      ev.currentTarget.classList.add('active');
    }

    function renderTeamSelectors() {
      const s1 = document.getElementById('matchTeam1Select');
      const s2 = document.getElementById('matchTeam2Select');
      let opts = '';
      Object.values(defaultTeams).forEach(t => opts += `<option value="${t.id}">${t.name}</option>`);
      s1.innerHTML = opts; s2.innerHTML = opts;
      s1.value = currentTeam1Id; s2.value = currentTeam2Id;
    }

    function changeMatchTeams() {
      currentTeam1Id = document.getElementById('matchTeam1Select').value;
      currentTeam2Id = document.getElementById('matchTeam2Select').value;
      localStorage.setItem('sl_t1', currentTeam1Id);
      localStorage.setItem('sl_t2', currentTeam2Id);
      setupMatchTeams();
    }

    function setTeamLogo(containerId, team) {
      const wrapper = document.getElementById(containerId);
      wrapper.innerHTML = `
        <img class="team-logo-img" src="${team.logo}" alt="${team.name}" 
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div class="team-logo-fallback" style="display:none;">${team.short}</div>
      `;
    }

    function setupMatchTeams() {
      const t1 = defaultTeams[currentTeam1Id];
      const t2 = defaultTeams[currentTeam2Id];

      document.getElementById('nameTeam1').innerText = t1.name;
      document.getElementById('nameTeam2').innerText = t2.name;

      setTeamLogo('logoWrap1', t1);
      setTeamLogo('logoWrap2', t2);

      document.getElementById('attTitle1').innerText = t1.name;
      document.getElementById('attTitle2').innerText = t2.name;

      // Asistencia base
      if (!attendance[currentTeam1Id]) attendance[currentTeam1Id] = [...t1.players];
      if (!attendance[currentTeam2Id]) attendance[currentTeam2Id] = [...t2.players];

      renderAttendanceLists();
      updateTeamDropdown();
      updatePlayerDropdowns();
      populateMVPSelect();
      renderEvents();
    }

    /* CRONÓMETRO */
    function toggleTimer() {
      if (timerRunning) {
        timerRunning = false;
        elapsedTimeBeforePause += Date.now() - startTime;
        clearInterval(timerInterval);
        document.getElementById('btnStart').innerText = "▶ Reanudar";
      } else {
        timerRunning = true;
        startTime = Date.now();
        document.getElementById('btnStart').innerText = "⏸ Pausa";
        timerInterval = setInterval(updateTimerClock, 250);
      }
    }

    function updateTimerClock() {
      if (!timerRunning) return;
      const totalElapsedMs = elapsedTimeBeforePause + (Date.now() - startTime);
      const totalSec = Math.floor(totalElapsedMs / 1000);
      const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${m}:${s}`;
      document.getElementById('minuteInput').value = Math.max(1, Math.ceil(totalSec / 60));
    }

    function setPeriod(p) {
      timerRunning = false;
      clearInterval(timerInterval);
      elapsedTimeBeforePause = 0;
      document.getElementById('timerDisplay').innerText = "00:00";
      document.getElementById('periodDisplay').innerText = p === 1 ? "1er Tiempo (25 Min)" : "2do Tiempo (25 Min)";
      document.getElementById('btnStart').innerText = "▶ Iniciar";
    }

    /* ASISTENCIA */
    function renderAttendanceLists() {
      [1, 2].forEach(num => {
        const teamId = num === 1 ? currentTeam1Id : currentTeam2Id;
        const container = document.getElementById(`list-att-${num}`);
        container.innerHTML = '';
        
        if (defaultTeams[teamId]) {
          defaultTeams[teamId].players.forEach(p => {
            const isAtt = attendance[teamId] && attendance[teamId].includes(p);
            container.innerHTML += `
              <div class="check-row">
                <label class="check-label">
                  <input type="checkbox" ${isAtt ? 'checked' : ''} onchange="toggleAttendance('${teamId}', '${p}')"> ${p}
                </label>
              </div>`;
          });
        }
      });
    }

    function toggleAttendance(teamId, player) {
      if (!attendance[teamId]) attendance[teamId] = [];
      
      if (attendance[teamId].includes(player)) {
        attendance[teamId] = attendance[teamId].filter(p => p !== player);
      } else {
        attendance[teamId].push(player);
      }
      
      saveAllData();
      updatePlayerDropdowns();
      populateMVPSelect();
    }

    /* FILTRADO DE JUGADORES */
    function updateTeamDropdown() {
      const ts = document.getElementById('teamSelect');
      ts.innerHTML = `
        <option value="${currentTeam1Id}">${defaultTeams[currentTeam1Id].name}</option>
        <option value="${currentTeam2Id}">${defaultTeams[currentTeam2Id].name}</option>`;
    }

    function updatePlayerDropdowns() {
      const selectedTeamId = document.getElementById('teamSelect').value;
      const playerSelect = document.getElementById('playerSelect');
      const assistSelect = document.getElementById('assistSelect');
      
      // LIMPIEZA ABSOLUTA
      playerSelect.innerHTML = '';
      assistSelect.innerHTML = '<option value="">-- Ninguna --</option>';

      const activePlayers = attendance[selectedTeamId] || [];

      if (activePlayers.length === 0) {
        playerSelect.innerHTML = '<option value="">-- No hay jugadores marcados en lista --</option>';
        return;
      }

      activePlayers.forEach(player => {
        const opt = document.createElement('option');
        opt.value = player;
        opt.innerText = player;
        playerSelect.appendChild(opt);

        const optA = document.createElement('option');
        optA.value = player;
        optA.innerText = player;
        assistSelect.appendChild(optA);
      });
    }

    function toggleAssistField() {
      document.getElementById('assistGroup').style.display = (document.getElementById('typeSelect').value === 'GOL') ? 'block' : 'none';
    }

    function addEvent() {
      const minute = document.getElementById('minuteInput').value || 1;
      const teamId = document.getElementById('teamSelect').value;
      const type = document.getElementById('typeSelect').value;
      const player = document.getElementById('playerSelect').value;
      const assist = type === 'GOL' ? document.getElementById('assistSelect').value : '';

      if (!player) return alert("Por favor selecciona un jugador.");

      events.push({ id: Date.now(), minute: parseInt(minute), teamId, type, player, assist });
      events.sort((a, b) => a.minute - b.minute);

      if (type === 'GOL') { try { confetti({ particleCount: 80, spread: 60 }); } catch(e){} }

      saveAllData();
      renderEvents();
    }

    function deleteEvent(id) {
      events = events.filter(e => e.id !== id);
      saveAllData();
      renderEvents();
    }

    function renderEvents() {
      const container = document.getElementById('eventsListContainer');
      let score1 = 0, score2 = 0;

      if (events.length === 0) {
        container.innerHTML = "<small style='color:var(--text-muted);'>Sin incidencias registradas.</small>";
      } else {
        container.innerHTML = '';
        events.forEach(e => {
          if (e.type === 'GOL') { 
            if (e.teamId === currentTeam1Id) score1++; 
            if (e.teamId === currentTeam2Id) score2++; 
          }
          const badgeClass = e.type === 'GOL' ? 'bg-gol' : e.type === 'A' ? 'bg-a' : 'bg-r';
          const teamName = defaultTeams[e.teamId] ? defaultTeams[e.teamId].name : 'Equipo';

          container.innerHTML += `
            <div class="timeline-item">
              <div>
                <span class="timeline-badge ${badgeClass}">${e.minute}' ${e.type}</span>
                <b style="margin-left:6px;">${e.player}</b> <small style="color:var(--text-muted);">(${teamName})</small>
                ${e.assist ? `<small style="color:var(--accent-gold); display:block;">👟 Asist: ${e.assist}</small>` : ''}
              </div>
              <button style="background:none; border:none; color:var(--accent-red); cursor:pointer; font-weight:bold; font-size:1.1rem;" onclick="deleteEvent(${e.id})">✕</button>
            </div>`;
        });
      }

      document.getElementById('score1').innerText = score1;
      document.getElementById('score2').innerText = score2;
    }

    function populateMVPSelect() {
      const mvpSelect = document.getElementById('mvpSelect');
      let opts = '<option value="">-- Seleccionar MVP --</option>';
      [currentTeam1Id, currentTeam2Id].forEach(teamId => {
        if (defaultTeams[teamId]) {
          opts += `<optgroup label="${defaultTeams[teamId].name}">`;
          (attendance[teamId] || []).forEach(p => opts += `<option value="${p} (${defaultTeams[teamId].name})">${p}</option>`);
          opts += `</optgroup>`;
        }
      });
      mvpSelect.innerHTML = opts;
      mvpSelect.value = selectedMVP;
    }

    function saveMVP() {
      selectedMVP = document.getElementById('mvpSelect').value;
      saveAllData();
    }

    function exportSummary() {
      const t1 = defaultTeams[currentTeam1Id].name;
      const t2 = defaultTeams[currentTeam2Id].name;
      const s1 = document.getElementById('score1').innerText;
      const s2 = document.getElementById('score2').innerText;

      let text = `📋 *SEVEN LEAGUE - ACTA OFICIAL DE PARTIDO*\n`;
      text += `👨‍⚖️ *Árbitro:* ${refereeName}\n`;
      text += `⚽ *${t1} [ ${s1} - ${s2} ] ${t2}*\n`;
      text += `-----------------------------------\n\n`;
      
      if (events.length === 0) {
        text += `_Sin incidencias ni goles registrados._\n`;
      } else {
        events.forEach(e => {
          const tName = defaultTeams[e.teamId] ? defaultTeams[e.teamId].name : '';
          text += `• ${e.minute}' ${e.type}: *${e.player}* (${tName}) ${e.assist ? '👟 Asist: ' + e.assist : ''}\n`;
        });
      }

      if (selectedMVP) text += `\n⭐ *MVP DEL PARTIDO:* ${selectedMVP}\n`;

      navigator.clipboard.writeText(text);
      alert("✅ ¡Acta oficial copiada con éxito! Ya puedes pegarla en WhatsApp.");
    }

    function archiveMatch() {
      const matchData = {
        date: new Date().toLocaleString(),
        referee: refereeName,
        t1: defaultTeams[currentTeam1Id].name, t2: defaultTeams[currentTeam2Id].name,
        s1: document.getElementById('score1').innerText, s2: document.getElementById('score2').innerText,
        mvp: selectedMVP
      };
      savedMatches.push(matchData);
      localStorage.setItem('sl_hist', JSON.stringify(savedMatches));
      renderHistory();
      alert("💾 Partido guardado en el historial.");
    }

    function renderHistory() {
      const container = document.getElementById('savedMatchesContainer');
      if (savedMatches.length === 0) { container.innerHTML = "Sin partidos archivados."; return; }
      container.innerHTML = '';
      savedMatches.forEach(m => {
        container.innerHTML += `
          <div style="border-bottom:1px solid #222; padding:8px 0;">
            <b>${m.t1} ${m.s1} - ${m.s2} ${m.t2}</b><br>
            <small style="color:var(--text-muted);">${m.date} | 👨‍⚖️ Árbitro: ${m.referee || 'SAMUEL MCKENZIE'} | ⭐ MVP: ${m.mvp || 'N/A'}</small>
          </div>`;
      });
    }

    function saveAllData() {
      localStorage.setItem('sl_att', JSON.stringify(attendance));
      localStorage.setItem('sl_ev', JSON.stringify(events));
      localStorage.setItem('sl_mvp', selectedMVP);
    }

    init();
  </script>
</body>
</html>
