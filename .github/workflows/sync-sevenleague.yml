name: Sync Seven League players
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - ".github/workflows/sync-sevenleague.yml"
      - "scripts/sync_sevenleague.py"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/sync_sevenleague.py
      - name: Commit catalog
        run: |
          git config user.name "Seven League Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/players.json
          git diff --cached --quiet || git commit -m "Sync official Seven League player data"
          git push
# production sync enabled\n# stats parser v2
